  note: 'CREXi publishes no client SDK for any of its APIs in any language. The @crexi-dev
    npm scope is real and first-party, but every package in it is internal Angular
    front-end tooling — mostly forks of community Angular libraries used to build crexi.com
    — not a client library for the Crexi Exchange, Platform or Listing API. Because
    of this, NO `SDKs` pointer is wired into apis.yml: emitting one would credit CREXi
    with an SDK surface it does not have.'
