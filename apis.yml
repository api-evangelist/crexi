aid: crexi
name: CREXi
description: 'CREXi (Commercial Real Estate Exchange, Inc.) is a Los Angeles-based
  commercial real estate marketplace and data platform founded in 2015, operating a
  sales marketplace, lease marketplace, auction platform, Broker PRO tools and the
  Crexi Intelligence property-records product. Its API surface is partner-gated rather
  than self-serve: the Crexi Listing API is a one-way syndication feed that lets MLSs,
  Realtor Boards, brokerages and data providers push listings into the marketplace
  (RESO, RETS, WebAPI and XML feeds, synced daily, with Crexi stating 100% compliance
  with the RESO Data Dictionary and 100+ partner organizations), while the Crexi Exchange
  API is documented in a password-protected Theneo portal at api-docs.crexi.com and
  fronted by an API-key-gated Swagger UI at exchange.crexi.com. The platform API host
  api.crexi.com publishes anonymous OpenID Connect and OAuth 2.0 authorization-server
  discovery documents.'
image: https://learn.crexi.com/hubfs/crexi%20logo%20navy%20text.svg
